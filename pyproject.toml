[project]
name = "am2oair-relay"
version = "0.1.0"
description = "Local Responses-to-Anthropic relay with a persistent metadata dashboard"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
