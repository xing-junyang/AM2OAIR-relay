name: am2oair-relay
services:
  relay:
    image: am2oair-relay:local
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AM2OAIR_RELAY_API_KEY: ${AM2OAIR_RELAY_API_KEY:?Set AM2OAIR_RELAY_API_KEY in .env}
      AM2OAIR_RELAY_BASE_URL: ${AM2OAIR_RELAY_BASE_URL:-https://api.poixe.com/v1}
      AM2OAIR_RELAY_MODEL: ${AM2OAIR_RELAY_MODEL:-aws-claude/claude-opus-5-5}
      AM2OAIR_RELAY_DATABASE_URL: ${AM2OAIR_RELAY_DATABASE_URL:-sqlite:////data/relay.db}
      AM2OAIR_RELAY_TIMEOUT_SECONDS: ${AM2OAIR_RELAY_TIMEOUT_SECONDS:-180}
      AM2OAIR_RELAY_DEFAULT_MAX_TOKENS: ${AM2OAIR_RELAY_DEFAULT_MAX_TOKENS:-8192}
      AM2OAIR_RELAY_COST_CURRENCY: ${AM2OAIR_RELAY_COST_CURRENCY:-USD}
      AM2OAIR_RELAY_COST_INPUT_PER_MILLION: ${AM2OAIR_RELAY_COST_INPUT_PER_MILLION:-}
      AM2OAIR_RELAY_COST_OUTPUT_PER_MILLION: ${AM2OAIR_RELAY_COST_OUTPUT_PER_MILLION:-}
      AM2OAIR_RELAY_COST_CACHE_READ_PER_MILLION: ${AM2OAIR_RELAY_COST_CACHE_READ_PER_MILLION:-}
      AM2OAIR_RELAY_COST_CACHE_WRITE_PER_MILLION: ${AM2OAIR_RELAY_COST_CACHE_WRITE_PER_MILLION:-}
      AM2OAIR_RELAY_COST_CACHE_WRITE_5M_PER_MILLION: ${AM2OAIR_RELAY_COST_CACHE_WRITE_5M_PER_MILLION:-}
      AM2OAIR_RELAY_COST_CACHE_WRITE_1H_PER_MILLION: ${AM2OAIR_RELAY_COST_CACHE_WRITE_1H_PER_MILLION:-}
    volumes:
      - relay_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  relay_data:
